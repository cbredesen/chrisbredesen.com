baseURL = "http://chrisbredesen.com/"
languageCode = "en-us"
title = "Chris Bredesen"
theme = "hugo-theme-m10cb"

[params]
  author = "Chris Bredesen"
  description = "Father, geek and software engineering leader writing about whatever is on my mind in the moment."
  avatar = "cb_iceland.jpeg"
  menu_item_separator = " | "

[params.style] 
  # Gemini helped with this 
  darkestColor  = "#1e293b"  # sidebar background (deep slate)
  darkColor     = "#f8fafc"  # main content background (cool off-white)
  lightColor    = "#334155"  # body text (soft dark slate)
  lightestColor = "#0f172a"  # headings (near-black slate)
  primaryColor  = "#e11d48"  # red — links, avatar ring, code borders (vibrant rose-red)

[[params.social]]
  icon = "brand-github"
  name = "GitHub"
  url = "https://github.com/cbredesen"

[[params.social]]
  icon = "brand-linkedin"
  name = "LinkedIn"
  url = "https://linkedin.com/in/breddy"

[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 3
