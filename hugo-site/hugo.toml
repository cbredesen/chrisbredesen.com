baseURL = "http://chrisbredesen.com/"
languageCode = "en-us"
title = "Chris Bredesen"
theme = "hugo-theme-m10cb"

[params]
  author = "Chris Bredesen"
  description = "Father, geek and software engineering leader writing about whatever is on my mind in the moment."
  avatar = ""
  menu_item_separator = " - "

[params.style]
  darkestColor  = "#353535"  # sidebar background
  darkColor     = "#e8e8e8"  # main content background
  lightColor    = "#2a2a2a"  # body text (dark for light bg)
  lightestColor = "#111111" # headings (dark for light bg)
  primaryColor  = "#c0392b"  # red — links, avatar ring, code borders

[[params.social]]
  icon = "brand-github"
  name = "GitHub"
  url = "https://github.com/cbredesen"

[[params.social]]
  icon = "brand-linkedin"
  name = "LinkedIn"
  url = "https://linkedin.com/in/breddy"

[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 3
